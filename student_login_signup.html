<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ProctorEx</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #008080;   /* Teal */
            --dark: #004d4d;      /* Dark Teal */
            --accent: #ff7f50;    /* Coral Orange */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e0f2f1;
            background: linear-gradient(135deg, #e0f2f1 0%, #008080 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            background-color: #fff; border-radius: 25px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.2), 0 10px 10px rgba(0,0,0,0.1);
            position: relative; overflow: hidden; width: 850px;
            max-width: 100%; min-height: 550px;
        }

        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }

        form {
            background-color: #ffffff; display: flex; align-items: center;
            justify-content: center; flex-direction: column; padding: 0 50px;
            height: 100%; text-align: center;
        }

        h1 { font-size: 28px; color: var(--primary); font-weight: 700; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }

        .input-group { position: relative; width: 100%; margin: 8px 0; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #aaa; transition: 0.3s; }

        input {
            background-color: #f0f4f4; border: 2px solid transparent;
            padding: 12px 15px 12px 45px; width: 100%;
            border-radius: 12px; outline: none; transition: 0.3s;
        }
        input:focus { background-color: #fff; border-color: var(--primary); }
        input:focus + i { color: var(--primary); }

        button {
            border-radius: 25px; border: none;
            background-color: var(--accent); color: #ffffff;
            font-size: 14px; font-weight: 700; padding: 12px 50px;
            letter-spacing: 1px; text-transform: uppercase;
            transition: 0.3s; cursor: pointer; margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 127, 80, 0.3);
        }
        button:hover { background-color: #e66e40; transform: scale(1.03); }
        button:active { transform: scale(0.95); }
        button.ghost { background-color: transparent; border: 2px solid #ffffff; box-shadow: none; }

        /* Transition Logic */
        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }

        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-up-container {
            transform: translateX(100%); opacity: 1; z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        /* Overlay Styling */
        .overlay-container {
            position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
            overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100;
        }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, var(--primary), var(--dark));
            color: #ffffff; position: relative; left: -100%;
            height: 100%; width: 200%;
            transform: translateX(0); transition: transform 0.6s ease-in-out;
        }
        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 0 40px; text-align: center;
            top: 0; height: 100%; width: 50%; transition: transform 0.6s ease-in-out;
        }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        .status-msg { 
            font-size: 12px; margin-top: 15px; display: none; 
            padding: 10px; border-radius: 8px; width: 100%; text-align: left;
        }
        .error { background: #ffecec; color: #c0392b; border-left: 4px solid #c0392b; }
        .success { background: #e8f8f5; color: #27ae60; border-left: 4px solid #27ae60; }

        .back-home {
            position: absolute; top: 20px; left: 20px; color: rgb(6, 66, 68);
            text-decoration: none; font-size: 14px; z-index: 1001; opacity: 0.8;
        }
        .back-home:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>

    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Home</a>

    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form id="studentSignupForm">
                <h1>Create Account</h1>
                <p>Join ProctorEx to start your exams</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Student Email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Password">
                </div>
                <button type="button" id="regBtn" onclick="handleRegister()">Sign Up</button>
                <div id="regStatus" class="status-msg"></div>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form id="studentLoginForm">
                <i class="fas fa-user-graduate" style="font-size: 50px; color: var(--primary); margin-bottom: 10px;"></i>
                <h1>Student Login</h1>
                <p>Access your exam dashboard</p>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email">
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" id="loginPass" placeholder="Password">
                </div>
                <button type="button" id="loginBtn" onclick="handleLogin()">Login Now</button>
                <div id="loginStatus" class="status-msg"></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Ready for Exam?</h1>
                    <p>If you already have an account, just login to continue.</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>New Student?</h1>
                    <p>Enter your details and start your secure exam journey with us.</p>
                    <button class="ghost" id="signUp">Register</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const BASE_URL = "http://127.0.0.1:8000";

        // Toggle Animation
        signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
        signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));

        // --- STUDENT LOGIN ---
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('loginStatus');

            if(!email || !password) {
                showMsg(status, "⚠️ Fields are empty!", "error");
                return;
            }

            try {
                btn.disabled = true; btn.innerText = "Verifying...";
                status.style.display = "none";

                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${BASE_URL}/auth/student/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('student_token', data.access_token);
                    btn.style.background = "#2ecc71";
                    btn.innerText = "Success!";
                    showMsg(status, "✅ Success! Redirecting...", "success");
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
                } else {
                    showMsg(status, "❌ Invalid Email or Password", "error");
                    btn.disabled = false; btn.innerText = "Login Now";
                }
            } catch (err) {
                showMsg(status, "❌ Server Error", "error");
                btn.disabled = false; btn.innerText = "Login Now";
            }
        }

        // --- STUDENT REGISTER ---
        async function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;
            const btn = document.getElementById('regBtn');
            const status = document.getElementById('regStatus');

            if(!name || !email || !password) {
                showMsg(status, "⚠️ Please fill all fields", "error");
                return;
            }

            try {
                btn.disabled = true; btn.innerText = "Processing...";
                const response = await fetch(`${BASE_URL}/auth/student/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    showMsg(status, "✅ Account created! Please login.", "success");
                    setTimeout(() => {
                        container.classList.remove("right-panel-active");
                        btn.disabled = false; btn.innerText = "Sign Up";
                    }, 2000);
                } else {
                    const data = await response.json();
                    showMsg(status, "❌ " + (data.detail || "Registration Failed"), "error");
                    btn.disabled = false; btn.innerText = "Sign Up";
                }
            } catch (err) {
                showMsg(status, "❌ Server Connection Error", "error");
                btn.disabled = false;
            }
        }

        function showMsg(el, text, type) {
            el.innerText = text;
            el.className = "status-msg " + type;
            el.style.display = "block";
        }
    </script>
</body>
</html>
