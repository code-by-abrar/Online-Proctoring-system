<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portal - ProctorEx</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #008080;   /* Teal */
            --dark: #004d4d;      /* Dark Teal */
            --accent: #ff7f50;    /* Coral Orange */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #004d4d 0%, #008080 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .container {
            background-color: #fff; border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            position: relative; overflow: hidden; width: 850px;
            max-width: 100%; min-height: 550px;
        }

        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }

        form {
            background-color: #ffffff; display: flex; align-items: center;
            justify-content: center; flex-direction: column; padding: 0 50px;
            height: 100%; text-align: center;
        }

        .input-group { position: relative; width: 100%; margin: 8px 0; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #aaa; }

        input {
            background-color: #eee; border: 2px solid transparent;
            padding: 12px 15px 12px 45px; margin: 2px 0; width: 100%;
            border-radius: 10px; outline: none; transition: 0.3s;
        }
        input:focus { background-color: #fff; border-color: var(--primary); }

        button {
            border-radius: 20px; border: 1px solid var(--primary);
            background-color: var(--primary); color: #ffffff;
            font-size: 12px; font-weight: bold; padding: 12px 45px;
            letter-spacing: 1px; text-transform: uppercase;
            transition: transform 80ms ease-in; cursor: pointer; margin-top: 15px;
        }
        button:active { transform: scale(0.95); }
        button.ghost { background-color: transparent; border-color: #ffffff; }

        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }

        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-up-container {
            transform: translateX(100%); opacity: 1; z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container {
            position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
            overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100;
        }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, var(--primary), var(--dark));
            color: #ffffff; position: relative; left: -100%;
            height: 100%; width: 200%;
            transform: translateX(0); transition: transform 0.6s ease-in-out;
        }
        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 0 40px; text-align: center;
            top: 0; height: 100%; width: 50%; transition: transform 0.6s ease-in-out;
        }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        .status-msg { 
            font-size: 12px; margin-top: 10px; display: none; 
            padding: 8px; border-radius: 5px; width: 100%;
        }
        .error { background: #fceceb; color: #e74c3c; border-left: 4px solid #e74c3c; }
        .success { background: #e8f8f5; color: #27ae60; border-left: 4px solid #27ae60; }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form>
                <h1>Create Institute</h1>
                <div class="input-group">
                    <i class="fas fa-university"></i>
                    <input type="text" id="regName" placeholder="Institute Name">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Official Email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Password">
                </div>
                <button type="button" id="regBtn" onclick="handleRegister()">Register Now</button>
                <div id="regStatus" class="status-msg"></div>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form>
                <h1>Admin Login</h1>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email" value="uni@test.com">
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" id="loginPass" placeholder="Password">
                </div>
                <button type="button" id="loginBtn" onclick="handleLogin()">Sign In</button>
                <div id="loginStatus" class="status-msg"></div>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Admin!</h1>
                    <p>Enter your institute details and start journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const BASE_URL = "http://127.0.0.1:8000";

        // UI Toggle
        signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
        signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));

        // --- REGISTER FUNCTION ---
        async function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;
            const btn = document.getElementById('regBtn');
            const status = document.getElementById('regStatus');

            if(!name || !email || !password) {
                showMsg(status, "⚠️ Fill all fields", "error");
                return;
            }

            try {
                btn.disabled = true; btn.innerText = "Registering...";
                const response = await fetch(`${BASE_URL}/auth/university/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    showMsg(status, "✅ Registered! Switching to Login...", "success");
                    setTimeout(() => {
                        container.classList.remove("right-panel-active");
                        btn.disabled = false; btn.innerText = "Register Now";
                    }, 2000);
                } else {
                    const data = await response.json();
                    showMsg(status, "❌ " + (data.detail || "Failed"), "error");
                    btn.disabled = false; btn.innerText = "Register Now";
                }
            } catch (err) {
                showMsg(status, "❌ Server Down", "error");
                btn.disabled = false;
            }
        }

        // --- LOGIN FUNCTION ---
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('loginStatus');

            try {
                btn.disabled = true; btn.innerText = "Checking...";
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${BASE_URL}/auth/university/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('uni_token', data.access_token);
                    showMsg(status, "✅ Success! Redirecting...", "success");
                    setTimeout(() => { window.location.href = "admin.html"; }, 1000);
                } else {
                    showMsg(status, "❌ Invalid Credentials", "error");
                    btn.disabled = false; btn.innerText = "Sign In";
                }
            } catch (err) {
                showMsg(status, "❌ Connection Error", "error");
                btn.disabled = false;
            }
        }

        function showMsg(el, text, type) {
            el.innerText = text;
            el.className = "status-msg " + type;
            el.style.display = "block";
        }
    </script>
</body>
</html>
