<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ProctorEx</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #008080;   
            --primary-light: #e0f2f2;
            --dark: #004d4d;      
            --accent: #ff7f50;    
            --bg: #f0f4f8;        
            --sidebar-width: 260px;
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background-color: var(--bg); display: flex; min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width); background: var(--dark);
            color: white; display: flex; flex-direction: column;
            position: fixed; height: 100vh; transition: 0.3s; z-index: 1000;
        }
        .sidebar-header {
            padding: 30px 20px; text-align: center;
            font-size: 24px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header span { color: var(--accent); }

        .nav-links { padding: 20px 0; flex-grow: 1; }
        .nav-item {
            padding: 15px 25px; display: flex; align-items: center; gap: 15px;
            color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--accent);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-width); flex-grow: 1; padding: 30px;
            transition: 0.3s;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; background: white; padding: 15px 30px;
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; 
                  display: flex; align-items: center; justify-content: center; color: white; }

        /* --- STAT CARDS --- */
        .stats-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .stat-card {
            background: white; padding: 20px; border-radius: 15px;
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-bottom: 4px solid var(--primary);
        }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; background: var(--primary-light);
                     display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; }

        /* --- EXAM CARDS --- */
        .section-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: var(--dark); }
        .exams-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px;
        }

        .exam-card {
            background: white; border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #eee; overflow: hidden;
            animation: fadeInUp 0.5s ease forwards; opacity: 0;
        }
        .exam-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .exam-status-tag {
            position: absolute; top: 15px; right: 20px; font-size: 11px;
            padding: 4px 12px; border-radius: 20px; font-weight: 700; text-transform: uppercase;
        }

        .tag-pending { background: #fff3e0; color: #ff9800; }
        .tag-completed { background: #e8f5e9; color: #4caf50; }

        .exam-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 15px; }
        .exam-info { font-size: 13px; color: #666; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .exam-info span { display: flex; align-items: center; gap: 8px; }

        .btn-action {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
        }
        .btn-start { background: var(--accent); color: white; }
        .btn-start:hover { background: #e66e40; box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4); }
        
        .result-box {
            background: #f8fafb; border-radius: 12px; padding: 15px; text-align: center;
        }
        .score-val { font-size: 22px; font-weight: 700; color: var(--primary); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-graduation-cap"></i> Proctor<span>Ex</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="#" class="nav-item"><i class="fas fa-book"></i> My Exams</a>
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Performance</a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        </div>
        <a href="javascript:void(0)" onclick="logout()" class="nav-item" style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1);">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <div class="main-content">
        <header>
            <div class="welcome-text">
                <h2 id="student-name">Welcome back!</h2>
                <p style="color: #888; font-size: 14px;">Here is what's happening with your exams.</p>
            </div>
            <div class="user-profile">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <span style="font-weight: 600;">Student Portal</span>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                <div><div style="font-size: 20px; font-weight: 700;" id="total-count">0</div><div style="font-size: 12px; color: #888;">Assigned</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #4caf50; background: #e8f5e9;"><i class="fas fa-check-double"></i></div>
                <div><div style="font-size: 20px; font-weight: 700;" id="done-count">0</div><div style="font-size: 12px; color: #888;">Completed</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--accent); background: #fff3e0;"><i class="fas fa-hourglass-half"></i></div>
                <div><div style="font-size: 20px; font-weight: 700;" id="pending-count">0</div><div style="font-size: 12px; color: #888;">Pending</div></div>
            </div>
        </div>

        <div class="section-title">Your Examination Portal</div>
        
        <div id="exams-list" class="exams-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary);"></i>
                <p style="margin-top: 15px;">Fetching your secure exam list...</p>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "http://127.0.0.1:8000";
        const token = localStorage.getItem('student_token');

        if (!token) window.location.href = "student_login_signup.html";

        async function fetchExams() {
            try {
                const response = await fetch(`${BASE_URL}/student/my-exams`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.status === 401) logout();

                const exams = await response.json();
                updateStats(exams);
                renderExams(exams);

            } catch (err) {
                document.getElementById('exams-list').innerHTML = `<div style="text-align:center; width:100%; color:red;">Connection Error with Backend</div>`;
            }
        }

        function updateStats(exams) {
            document.getElementById('total-count').innerText = exams.length;
            document.getElementById('done-count').innerText = exams.filter(e => e.status === 'submitted').length;
            document.getElementById('pending-count').innerText = exams.filter(e => e.status !== 'submitted').length;
        }

        function renderExams(exams) {
            const container = document.getElementById('exams-list');
            container.innerHTML = "";

            exams.forEach((exam, index) => {
                const isCompleted = exam.status === "submitted";
                const date = new Date(exam.start_time).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
                
                const card = document.createElement('div');
                card.className = 'exam-card';
                card.style.animationDelay = `${index * 0.1}s`; // Staggered Effect

                card.innerHTML = `
                    <span class="exam-status-tag ${isCompleted ? 'tag-completed' : 'tag-pending'}">
                        ${isCompleted ? 'Completed' : 'Upcoming'}
                    </span>
                    <div class="exam-name">${exam.name}</div>
                    <div class="exam-info">
                        <span><i class="far fa-calendar-alt"></i> ${date}</span>
                        <span><i class="far fa-clock"></i> ${exam.duration} Minutes Duration</span>
                        <span><i class="fas fa-shield-alt"></i> AI Proctoring Enabled</span>
                    </div>
                    ${isCompleted ? `
                        <div class="result-box">
                            <div style="font-size: 11px; color: #888;">RESULT OBTAINED</div>
                            <div class="score-val">${exam.score || 0}%</div>
                            <div style="font-size: 12px; color: ${exam.violations > 0 ? '#e74c3c' : '#27ae60'}">
                                ${exam.violations > 0 ? `<i class="fas fa-exclamation-circle"></i> ${exam.violations} Violations` : `<i class="fas fa-check-circle"></i> Integrity Maintained`}
                            </div>
                        </div>
                    ` : `
                        <a href="test_exam.html?id=${exam.id}" class="btn-action btn-start">
                            <i class="fas fa-play-circle"></i> Start Examination
                        </a>
                    `}
                `;
                container.appendChild(card);
            });
        }

        function logout() {
            localStorage.removeItem('student_token');
            window.location.href = "student_login_signup.html";
        }

        fetchExams();
    </script>
</body>
</html>
