<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Success - ProctorEx</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #008080;   /* Teal */
            --dark: #004d4d;      /* Dark Teal */
            --accent: #ff7f50;    /* Coral Orange */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #008080 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            margin: 0;
        }

        .result-card {
            background: white;
            padding: 50px 40px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            border-top: 8px solid var(--primary);
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-circle {
            width: 90px; height: 90px;
            background: #e8f8f5; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 45px; margin: 0 auto 25px;
            box-shadow: 0 0 0 10px rgba(0, 128, 128, 0.05);
        }

        h1 { color: var(--dark); margin: 0; font-size: 26px; font-weight: 700; }
        p { color: #7f8c8d; margin-top: 10px; font-size: 15px; line-height: 1.5; }

        .status-box {
            background: #f9f9f9; padding: 20px; border-radius: 10px;
            margin: 30px 0; border: 1px dashed #ccc;
        }
        .status-text { font-size: 14px; color: #555; font-weight: 600; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 15px 30px; width: 100%; box-sizing: border-box;
            background: var(--accent); color: white;
            text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 16px;
            box-shadow: 0 5px 15px rgba(255, 127, 80, 0.3);
            transition: 0.3s;
        }
        .btn:hover { background: #e66e40; transform: translateY(-3px); }

        /* Animation */
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <div class="result-card">
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>
        
        <h1>Exam Submitted!</h1>
        <p>Your exam data has been securely recorded. <br>Please check your dashboard for the final score.</p>

        <div class="status-box">
            <div class="status-text">
                <i class="fas fa-shield-alt" style="color:var(--primary)"></i> Proctoring Report Generated
            </div>
        </div>

        <a href="dashboard.html" class="btn">
            Go to Dashboard <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <script>
        // Humne Score yahan se hata diya hai kyun ke
        // Score ab directly Dashboard par API se fetch hoga.
        // Ye page sirf "Success Message" ke liye hai.
        
        // Clear specific exam data from local storage if needed
        localStorage.removeItem('exam_result'); 
    </script>

</body>
</html>
